name: Build and Publish Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies (all)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow matplotlib numpy

      - name: Install Windows-only dependencies
        if: runner.os == 'Windows'
        run: pip install pywin32

      - name: Build executable
        run: python tools/pyinstaller.py

      - name: Rename Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Rename-Item -Path "dist/Budget Planner.exe" -NewName "Budget-Planner-windows-x86_64.exe"

      - name: Rename Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mv "dist/Budget Planner" "dist/Budget-Planner-linux-x86_64"
          chmod +x "dist/Budget-Planner-linux-x86_64"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-release-binary
          path: dist/Budget-Planner-*
          if-no-files-found: error

  release:
    name: Publish GitHub Release Assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/Budget-Planner-*
          generate_release_notes: true
          fail_on_unmatched_files: true
