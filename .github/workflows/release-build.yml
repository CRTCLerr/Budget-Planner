name: Build and Publish Release Assets

on:
  push:
    branches:
      - main
    paths:
      - core/app_version.py
      - .github/workflows/release-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: windows-release-assets
            portable_name: BudgetPlanner-windows-x86_64.zip
          - os: ubuntu-latest
            artifact_name: linux-release-assets
            portable_name: BudgetPlanner-linux-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow matplotlib numpy

      - name: Install Windows-only dependencies
        if: runner.os == 'Windows'
        run: pip install pywin32

      - name: Build executable
        run: python tools/pyinstaller.py

      - name: Verify Windows build output
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Force | Format-Table Name,Length
          if (!(Test-Path "dist/BudgetPlanner/BudgetPlanner.exe")) {
            throw "Expected dist/BudgetPlanner/BudgetPlanner.exe was not produced by PyInstaller."
          }

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = @'
          from pathlib import Path
          import re

          text = Path("core/app_version.py").read_text(encoding="utf-8")
          match = re.search(r"APP_VERSION\s*=\s*['\"]([^'\"]+)['\"]", text)
          print(match.group(1) if match else "")
          '@ | python -
                    $version = $version.Trim()
                    if ([string]::IsNullOrWhiteSpace($version)) {
                      throw "APP_VERSION is empty or unreadable from core/app_version.py"
                    }
                    if (!(Test-Path "dist/BudgetPlanner/BudgetPlanner.exe")) {
                      throw "Expected dist/BudgetPlanner/BudgetPlanner.exe before installer build."
                    }

          # Resolve ISCC dynamically because install location can vary on hosted runners.
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $candidatePaths = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe",
              "C:\ProgramData\chocolatey\bin\iscc.exe"
            )
            foreach ($candidate in $candidatePaths) {
              if (Test-Path $candidate) {
                $iscc = $candidate
                break
              }
            }
          }

          if (-not $iscc) {
            throw "ISCC.exe was not found after installing Inno Setup."
          }

          Write-Host "Using ISCC at: $iscc"
          Write-Host "Contents of dist/BudgetPlanner:"
          Get-ChildItem -Path "dist/BudgetPlanner" -Recurse | Select-Object FullName,Length

          & $iscc "tools\installer.iss" "/DAppVersion=$version"

      - name: Create Windows zip package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/BudgetPlanner/*" -DestinationPath "dist/${{ matrix.portable_name }}" -Force

      - name: Rename Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ ! -f "dist/BudgetPlanner/BudgetPlanner" ]; then
            echo "Expected dist/BudgetPlanner/BudgetPlanner was not produced by PyInstaller." >&2
            exit 1
          fi
          chmod +x "dist/BudgetPlanner/BudgetPlanner"
          tar -czf "dist/${{ matrix.portable_name }}.tar.gz" -C dist BudgetPlanner

      - name: Upload Windows portable artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.portable_name }}
            dist/BudgetPlanner-Setup-windows-x86_64.exe
          if-no-files-found: error

      - name: Upload Linux build artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.portable_name }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "from pathlib import Path; import re; text = Path('core/app_version.py').read_text(encoding='utf-8'); m = re.search(r'APP_VERSION\\s*=\\s*[\"\']([^\"\']+)[\"\']', text); print(m.group(1) if m else '')")
          if [ -z "$VERSION" ]; then
            echo "APP_VERSION not found in core/app_version.py" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create tag if missing
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if ! git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: |
            release_assets/BudgetPlanner-windows-x86_64.zip
            release_assets/BudgetPlanner-Setup-windows-x86_64.exe
            release_assets/BudgetPlanner-linux-x86_64.tar.gz
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true

