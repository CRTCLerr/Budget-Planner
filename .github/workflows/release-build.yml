name: Build and Publish Release Assets

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Windows Release Assets
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow matplotlib numpy
          pip install pywin32

      - name: Build executable
        run: python tools/pyinstaller.py

      - name: Rename portable executable
        shell: pwsh
        run: |
          Rename-Item -Path "dist/Budget Planner.exe" -NewName "Budget-Planner-windows-x86_64.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "tools\installer.iss" "/DAppVersion=$version"

      - name: Publish Windows assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Budget-Planner-windows-x86_64.exe
            dist/Budget-Planner-Setup-windows-x86_64.exe
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true

  linux-release:
    name: Linux Release Asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow matplotlib numpy

      - name: Build executable
        run: python tools/pyinstaller.py

      - name: Rename Linux executable
        shell: bash
        run: |
          mv "dist/Budget Planner" "dist/Budget-Planner-linux-x86_64"
          chmod +x "dist/Budget-Planner-linux-x86_64"

      - name: Publish Linux asset to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Budget-Planner-linux-x86_64
          overwrite_files: true
          fail_on_unmatched_files: true
