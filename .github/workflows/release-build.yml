name: Build and Publish Release Assets

on:
  push:
    branches:
      - main
    paths:
      - core/app_version.py
      - .github/workflows/release-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: windows-release-assets
            portable_name: BudgetPlanner-windows-x86_64.exe
          - os: ubuntu-latest
            artifact_name: linux-release-assets
            portable_name: BudgetPlanner-linux-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow matplotlib numpy

      - name: Install Windows-only dependencies
        if: runner.os == 'Windows'
        run: pip install pywin32

      - name: Build executable
        run: python tools/pyinstaller.py

      - name: Verify Windows build inputs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Force | Format-Table Name,Length
          if (!(Test-Path "dist/BudgetPlanner.exe")) {
            throw "Expected dist/BudgetPlanner.exe was not produced by PyInstaller."
          }
          if (!(Test-Path "tools/installer.iss")) {
            throw "Installer script tools/installer.iss is missing."
          }

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = python -c "from pathlib import Path; import re; text = Path('core/app_version.py').read_text(encoding='utf-8'); m = re.search(r'APP_VERSION\\s*=\\s*[\"\']([^\"\']+)[\"\']', text); print(m.group(1) if m else '')"
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "APP_VERSION is empty or unreadable from core/app_version.py"
          }

          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) {
            $fallback = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path $fallback) {
              $iscc = $fallback
            }
          }
          if (-not $iscc) {
            throw "Inno Setup compiler (ISCC.exe) was not found after install step."
          }

          Write-Host "Using ISCC: $iscc"
          Write-Host "Installer version: $version"
          & $iscc "tools\installer.iss" "/DAppVersion=$version"
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC failed with exit code $LASTEXITCODE"
          }

      - name: Copy portable executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item -Path "dist/BudgetPlanner.exe" -Destination "dist/${{ matrix.portable_name }}" -Force

      - name: Rename Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mv "dist/BudgetPlanner" "dist/${{ matrix.portable_name }}"
          chmod +x "dist/${{ matrix.portable_name }}"

      - name: Upload Windows build artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.portable_name }}
            dist/BudgetPlanner-Setup-windows-x86_64.exe
          if-no-files-found: error

      - name: Upload Linux build artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.portable_name }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "from pathlib import Path; import re; text = Path('core/app_version.py').read_text(encoding='utf-8'); m = re.search(r'APP_VERSION\\s*=\\s*[\"\']([^\"\']+)[\"\']', text); print(m.group(1) if m else '')")
          if [ -z "$VERSION" ]; then
            echo "APP_VERSION not found in core/app_version.py" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create tag if missing
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if ! git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: |
            release_assets/BudgetPlanner-windows-x86_64.exe
            release_assets/BudgetPlanner-Setup-windows-x86_64.exe
            release_assets/BudgetPlanner-linux-x86_64
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
